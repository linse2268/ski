<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<title>Ski-Countdown</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232c3c62%22/><path d=%22M10 78 40 30 55 55 68 38 90 78z%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --nacht:#0b1a33; --dunkelblau:#2c3c62; --hellblau:#5371b5; --eis:#cfe6ff;
  --weiss:#fff; --rot:#e54b4b; --rot-dunkel:#c54141;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--nacht);overscroll-behavior:none}
body{
  margin:0; min-height:100vh; color:var(--weiss);
  font-family:"Inter",system-ui,sans-serif;
  background:transparent; overflow-x:hidden; overscroll-behavior:none;
}
/* Hintergrund liegt fest hinter allem, dadurch keine weißen Balken beim Überscrollen */
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,var(--nacht) 0%,var(--dunkelblau) 55%,var(--hellblau) 100%)}
#schnee{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.berge{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:-1;pointer-events:none}
.berge svg{width:100%;height:100%;display:block}

main{max-width:1400px;margin:0 auto;
  padding:calc(6vh + env(safe-area-inset-top,0px)) 4vw calc(8vh + env(safe-area-inset-bottom,0px))}

.hero{text-align:center;min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem}
.klein{font-size:clamp(1.1rem,2.5vw + .5rem,1.9rem);color:var(--eis);margin:0}
.zahl{
  font-family:"Archivo Black",Impact,sans-serif;
  font-size:clamp(5rem,22vw,14rem);line-height:1;margin:0;
  background:linear-gradient(180deg,#fff,var(--eis));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.35));
}
.zahl.wort{font-size:clamp(3.5rem,16vw,10rem);color:var(--weiss);background:none;-webkit-text-fill-color:currentColor}
.knopf{
  display:inline-block;margin-top:1rem;padding:.9rem 1.6rem;border-radius:999px;
  background:var(--rot);color:var(--weiss);text-decoration:none;font-weight:600;
  box-shadow:0 6px 0 var(--rot-dunkel);transition:transform .1s,box-shadow .1s;
}
.knopf:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rot-dunkel)}

h2{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(1.4rem,3vw + .6rem,2.2rem);margin:5vh 0 2vh;text-align:center}
/* Bilder immer untereinander, so groß wie möglich */
.cams{display:flex;flex-direction:column;gap:1.5rem}
figure{margin:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;overflow:hidden;backdrop-filter:blur(6px)}
.bild{overflow:hidden;background:rgba(0,0,0,.25);min-height:140px}
.bild img{display:block;width:100%;height:auto;color:var(--eis);font-size:.9rem}
figcaption{padding:.7rem 1rem .9rem}
figcaption b{display:block;font-size:1.05rem}
figcaption small{display:block;margin-top:.25rem;color:var(--eis);line-height:1.5}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="schnee"></canvas>
<div class="berge"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V120l150-80 130 70 170-100 190 120 140-60 190 90 230-90v220z" fill="#fff" opacity=".12"/><path d="M0 200V150l180-60 160 50 200-80 220 100 180-50 260 70v20z" fill="#fff" opacity=".2"/></svg></div>

<main>
  <section class="hero">
    <p class="klein" id="vor"></p>
    <h1 class="zahl" id="zahl">…</h1>
    <p class="klein" id="nach"></p>
    <a class="knopf" target="_blank" rel="noopener" href="https://www.ok-bergbahnen.com/skigebiete/pistenplan-interaktiv/">Zum interaktiven Pistenplan</a>
  </section>

  <h2>Live von den Bergen</h2>
  <section class="cams" id="cams"></section>
</main>

<script>
/* ===== EINSTELLUNGEN – hier einfach ändern ===== */
const START = { monat: 12, tag: 27 };   // erster Skitag
const ENDE  = { monat: 1,  tag: 2  };   // letzter Skitag (Ende des Urlaubs)

const WEBCAMS = [
  { name: "Heuberg – Bergstation",    url: "https://webcams.tramino.net/das-hoechste/heuberg-bergstation.jpg" },
  { name: "Kanzelwand – Bergstation", url: "https://webcams.tramino.net/das-hoechste/kanzelwand-bergstation.jpg" },
  { name: "Fellhorn – Gipfelstation", url: "https://webcams.tramino.net/das-hoechste/fellhorn-gipfelstation.jpg" },
  { name: "Fellhorn – Mittelstation", url: "https://webcams.tramino.net/das-hoechste/fellhorn-mittelstation.jpg" }
];
/* =============================================== */

const TAG = 86400000;
const $ = id => document.getElementById(id);

function saison(heute) {
  const folgejahr = (ENDE.monat < START.monat) || (ENDE.monat === START.monat && ENDE.tag < START.tag);
  const jahr = heute.getFullYear();
  for (const y of [jahr - 1, jahr]) {
    const s = new Date(y, START.monat - 1, START.tag);
    const e = new Date(folgejahr ? y + 1 : y, ENDE.monat - 1, ENDE.tag);
    if (heute <= e) return { s, e };
  }
}

function aktualisieren() {
  const n = new Date();
  const heute = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const { s, e } = saison(heute);
  if (heute >= s && heute <= e) {
    $("vor").textContent = "";
    $("zahl").textContent = "Heute";
    $("zahl").classList.add("wort");
    $("nach").textContent = "stehe ich auf der Piste!";
  } else {
    const d = Math.round((s - heute) / TAG);
    $("zahl").classList.remove("wort");
    $("vor").textContent = "In …";
    $("zahl").textContent = d;
    $("nach").textContent = (d === 1 ? "Tag" : "Tagen") + " stehe ich wieder auf der Piste.";
  }
}
aktualisieren();
setInterval(aktualisieren, 60000);

/* Webcams */
const fmt = d => d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });

function bildLaden(c) {
  const url = c.url + "?t=" + Date.now();
  c.img.src = url;
  // Zeitstempel der Aufnahme (nur wenn der Server es per CORS erlaubt)
  c.aufnahme = "";
  fetch(url, { method: "HEAD", cache: "no-store" })
    .then(r => { const lm = r.headers.get("last-modified"); if (lm) { c.aufnahme = "Aufnahme: " + fmt(new Date(lm)) + " Uhr";} })
    .catch(() => {});
}

WEBCAMS.forEach(c => {
  const f = document.createElement("figure");
  const wrap = document.createElement("div"); wrap.className = "bild";
  const img = document.createElement("img");
  img.alt = "Webcambild „" + c.name + "“ konnte nicht geladen werden";
  img.loading = "lazy";
  wrap.append(img);
  const cap = document.createElement("figcaption");
  const titel = document.createElement("b"); titel.textContent = c.name;
  const info = document.createElement("small");
  cap.append(titel, info);
  f.append(wrap, cap);
  $("cams").append(f);

  c.img = img; c.aufnahme = ""; c.geladen = "";
  c.zeigeInfo = () => { info.textContent = c.geladen + c.aufnahme; };

  bildLaden(c);
});
// alle 5 Minuten neu laden
setInterval(() => WEBCAMS.forEach(bildLaden), 300000);

/* Schneefall */
(function () {
  const cv = $("schnee"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w = 0, h = 0, flocken = [];
  function neu() {
    flocken = Array.from({ length: Math.min(140, Math.round(w * h / 12000)) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.5 + .8, v: Math.random() * 1 + .4, p: Math.random() * 6
    }));
  }
  function groesse() {
    const breiteNeu = innerWidth !== w;
    w = cv.width = innerWidth; h = cv.height = innerHeight;
    if (breiteNeu) neu();   // bei reiner Höhenänderung (Adressleiste am Handy) bleiben die Flocken
  }
  function los() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    flocken.forEach(f => {
      f.y += f.v; f.p += .01; f.x += Math.sin(f.p) * .5;
      if (f.y > h) { f.y = -5; f.x = Math.random() * w; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    });
    requestAnimationFrame(los);
  }
  addEventListener("resize", groesse);
  groesse(); los();
})();
</script>
</body>
</html>
